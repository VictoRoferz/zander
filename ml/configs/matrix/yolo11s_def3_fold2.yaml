# Phase-1 matrix (split_v2, 3 classes) — same frozen data, same photo-level
# scorer for every candidate. Online augmentation: train/ultralytics_run.py.
name: yolo11s_def3_fold2
model: yolo11s.pt
adapter: ultralytics
dataset_id: ds_v2_def3
fold: fold2
epochs: 120
imgsz: 640
batch: 16
seed: 20260806
# Per-epoch validation off (user decision 2026-10-09): the numbers are never used
# (the last epoch is kept) and the pass cost ~15-25 % of the matrix GPU time.
# Ultralytics still validates the final epoch.
extra:
  val: false
